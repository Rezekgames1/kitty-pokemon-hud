# Kitty Pokémon HUD theme. Loaded from ~/.config/kitty/kitty.conf.
font_family MesloLGS NF
font_size 15.0

background #11111b
foreground #cdd6f4
cursor #89b4fa
cursor_text_color #11111b
cursor_shape beam
cursor_blink_interval 0.6
selection_background #45475a
selection_foreground #cdd6f4

# Transparent, but deliberately unblurred: blur creates a visible rectangle
# around Kitty graphics-protocol images on macOS.
background_opacity 0.88
background_blur 0
dynamic_background_opacity no

window_padding_width 14
window_padding_height 12
macos_titlebar_color background
macos_option_as_alt both

tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #11111b
active_tab_background #89b4fa
inactive_tab_foreground #a6adc8
inactive_tab_background #313244

color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #cba6f7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #94e2d5
color15 #a6adc8

enable_audio_bell no
shell zsh
